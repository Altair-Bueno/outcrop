[package]
name = "outcrop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Static, no_std, sans-IO incremental evaluation of context-dependent signals"
keywords.workspace = true
categories = ["no-std", "no-std::no-alloc", "embedded", "algorithms"]

[features]
macros = ["dep:outcrop-macros"]

[dependencies]
outcrop-macros = { workspace = true, optional = true }

[[test]]
name = "strata"
required-features = ["macros"]

[lints]
workspace = true

[[example]]
name = "routers"
required-features = ["macros"]
